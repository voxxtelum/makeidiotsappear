name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build stripped copy
        run: |
          git clone --no-hardlinks --local . build
          python3 scripts/strip_comments.py build --exclude Libs

      - name: Package AddOn
        uses: BigWigsMods/packager@v2
        with:
          args: -t build -r "${{ github.workspace }}/.release" -g classic -n "{package-name}-{project-version}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: .release/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
